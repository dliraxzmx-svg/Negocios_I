<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | VANTA</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><a href="inicio.html" class="logo-container"><span class="logo-mark">V</span> VANTA</a><ul><li><a href="inicio.html">Inicio</a></li>
    <li><a href="catalogo.html">Catálogo</a></li>
    <li><a href="nosotros.html">Nosotros</a></li></ul></nav><main><section class="tarjeta-seccion auth-regalos"><h2>Iniciar Sesión</h2><form id="formLogin">

            id="customAlert" class="modal-overlay"><div class="modal-box"><h3 id="alertTitulo">Aviso</h3><p id="alertMensaje">Mensaje</p><button class="btn"
