
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VANTA | Iniciar sesión</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth-body">

    <!-- HEADER -->
    <header class="header">

        <nav class="nav container">

            <a class="logo" href="index.html">
                <span>V</span> VANTA
            </a>

            <a class="back-link" href="index.html">
                ← Volver al inicio
            </a>

        </nav>

    </header>


    <!-- LOGIN -->
    <main class="auth-main netflix-login">

        <section class="auth-card">

            <p class="eyebrow">VANTA</p>

            <h1>Iniciar sesión</h1>

            <p class="muted">
                Inicia sesión para continuar disfrutando de VANTA.
            </p>


            <form id="login-form">

                <!-- CORREO -->
                <label>
                    Correo electrónico

                    <input
                        type="email"
                        id="login-email"
                        required
                        placeholder="tu@email.com"
                        autocomplete="email"
                    >

                </label>


                <!-- CONTRASEÑA -->
                <label class="password-label">

                    Contraseña

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="login-password"
                            required
                            placeholder="••••••••"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="password-toggle"
                        >
                            Mostrar
                        </button>

                    </div>

                </label>


                <!-- OPCIONES -->
                <div class="login-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="remember-me"
                        >

                        <span>Recuérdame</span>

                    </label>


                    <button
                        type="button"
                        id="help-login"
                        class="help-login"
                    >
                        ¿Necesitas ayuda?
                    </button>

                </div>


                <!-- BOTÓN LOGIN -->
                <button
                    class="btn btn-primary full login-submit"
                    type="submit"
                >
                    Entrar
                </button>

            </form>


            <!-- MENSAJE -->
            <p
                id="login-message"
                class="form-message"
            ></p>


            <!-- DIVISOR -->
            <div class="auth-divider">

                <span>o</span>

            </div>


            <!-- REGISTRO -->
            <p class="auth-switch">

                ¿No tienes cuenta?

                <a href="registro.html">
                    Regístrate aquí
                </a>

            </p>


            <!-- FOOTER -->
            <p class="login-footer">

                Al continuar, aceptas los términos y condiciones
                de VANTA.

            </p>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="js/app.js"></script>

</body>

</html>
