<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VANTA | Registro</title><link rel="stylesheet" href="css/styles.css"></head>
<body class="auth-body">
<header class="header"><nav class="nav container"><a class="logo" href="index.html"><span>V</span> VANTA</a><a class="back-link" href="index.html">← Volver al inicio</a></nav></header>
<main class="auth-main"><section class="auth-card"><p class="eyebrow">ÚNETE A VANTA</p><h1>Crear cuenta</h1><p class="muted">Registra tus datos para crear tu perfil.</p><form id="register-form"><label>Nombre completo<input type="text" id="register-name" required placeholder="Tu nombre"></label><label>Correo electrónico<input type="email" id="register-email" required placeholder="tu@email.com"></label><label>Contraseña<input type="password" id="register-password" required minlength="4" placeholder="Mínimo 4 caracteres"></label><button class="btn btn-primary full" type="submit">Crear cuenta</button></form><p id="register-message" class="form-message"></p><p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p></section></main>
<script src="js/app.js"></script></body></html>
